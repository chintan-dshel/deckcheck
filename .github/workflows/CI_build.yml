name: CI_build

on: [push, pull_request]

jobs:
  build:

    runs-on: windows-latest
    env:
      Projectname: deckcheck
    strategy:
      fail-fast: false
      matrix:
        build_configuration: [Release]
        build_platform: [x64]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3
      

    - name: Build of plugin dll Release via scripts
      working-directory: .\editors\notepadpp
      run: |
           .\build.ps1 -Test

    - name: Archive artifacts for ${{ matrix.build_platform }}
      uses: actions/upload-artifact@v7
      with:
          name: deckcheck-npp-${{ matrix.build_platform }}
          path: ./editors/notepadpp/out/deckcheck/DeckcheckNpp.dll

    - name: Create release on tagging
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
          files: deckcheck-npp-${{ matrix.build_platform }}.zip