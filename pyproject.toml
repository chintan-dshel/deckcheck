[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deckcheck"
version = "0.1.0"
description = "A linter for LS-DYNA keyword decks"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
deckcheck = "deckcheck.cli:main"

[project.optional-dependencies]
bakeoff = ["dynars==1.1.0", "psutil>=5.9"]
lsp = ["pygls==2.1.1"]
dev = ["pytest>=8", "pytest-lsp==1.0.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/deckcheck"]

[tool.hatch.build.targets.wheel.force-include]
"NOTICE" = "deckcheck/NOTICE"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["stress: generated heavy decks; run with DECKCHECK_STRESS=1","lsdyna: needs the local LS-DYNA Student install", "extract: needs .venv-extract (ansys-dyna-core)", "corpus: needs a downloaded corpus deck", "install: builds a wheel and a fresh venv (slow, needs hatchling from PyPI)"]
